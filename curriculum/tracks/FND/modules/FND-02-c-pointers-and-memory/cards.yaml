# Seed retrieval deck for FND-02-c-pointers-and-memory. Minimum 12 cards (D4).
# Free recall only. The answer must not be visible in the prompt. Answer side ~60 words max.
# Scheduling fields are added by scripts/srs.py when the learner imports the deck.

cards:
  - id: FND-02-c-pointers-and-memory-c01
    type: fact
    prompt: "A global declared `int count = 0;`: which section holds it, and why not the one its initialiser suggests?"
    answer: ".bss. Zero-initialised (and uninitialised) statics go in .bss, which the loader fills with zeros. Only non-zero initialised statics go in .data."
  - id: FND-02-c-pointers-and-memory-c02
    type: concept
    prompt: "`static const char *g = \"abc\";` creates two objects. Name both, their sizes on x86-64, and their regions."
    answer: "An 8-byte pointer `g` in .data (static, non-zero initialised), and a 4-byte array {'a','b','c','\\0'} in .rodata (string literal, read-only)."
  - id: FND-02-c-pointers-and-memory-c03
    type: concept
    prompt: "Inside `void f(int b[16])`, what is `sizeof b` on x86-64, and why?"
    answer: "8. An array parameter is adjusted to a pointer (`int *b`). The 16 is ignored, so sizeof gives the pointer's size."
  - id: FND-02-c-pointers-and-memory-c04
    type: fact
    prompt: "For `int a[10];`, how many bytes apart are `&a[0]` and `&a[3]`, and what does `&a[3] - &a[0]` evaluate to?"
    answer: "12 bytes apart (3 x sizeof(int)). The pointer difference evaluates to 3, because subtraction counts elements, not bytes."
  - id: FND-02-c-pointers-and-memory-c05
    type: concept
    prompt: "State the invariant every C string buffer must keep, as an inequality between two named quantities."
    answer: "size >= length + 1, where size is the bytes the buffer owns and length is what strlen returns. The +1 is the terminating NUL."
  - id: FND-02-c-pointers-and-memory-c06
    type: fact
    prompt: "Which CWE number and name cover the iperf3 auth bug CVE-2025-54349?"
    answer: "CWE-193, off-by-one error (per the MITRE record)."
  - id: FND-02-c-pointers-and-memory-c07
    type: concept
    prompt: "iperf3 CVE-2025-54349: which function allocated the block, which function overflowed it, and with what index?"
    answer: "decrypt_rsa_message allocated keysize bytes for the plaintext. Its caller decode_auth_setting wrote the terminator at plaintext[plaintext_len], where plaintext_len could equal keysize."
  - id: FND-02-c-pointers-and-memory-c08
    type: concept
    prompt: "Why can a one-byte heap overflow in a normal glibc build show no symptom at all?"
    answer: "malloc often returns more usable bytes than requested (glibc 2.41 in the lab: malloc(256) has 264 usable). The stray byte lands in unused slack. It hits the next chunk's size field only when the request exactly fills the usable size, and even then only a later check, e.g. at free, notices."
  - id: FND-02-c-pointers-and-memory-c09
    type: procedure
    prompt: "Before running a suspected off-by-one heap write under ASan, which six report fields do you write down?"
    answer: "1. Error kind (heap-buffer-overflow). 2. READ or WRITE. 3. Access size. 4. 'N bytes after M-byte region'. 5. frame0: first frame not in a sanitizer interceptor or libc, function:line. 6. Allocation frame, function:line."
  - id: FND-02-c-pointers-and-memory-c10
    type: code
    prompt: "Write the gcc line that builds t.c with all four of these off: stack protector, PIE, RELRO, FORTIFY."
    answer: "gcc -g -O0 -fno-stack-protector -no-pie -Wl,-z,norelro -D_FORTIFY_SOURCE=0 t.c -o t.weak"
  - id: FND-02-c-pointers-and-memory-c11
    type: procedure
    prompt: "Which readelf command and output show PIE, NX, RELRO, full RELRO and a canary in a binary?"
    answer: "PIE: readelf -h, Type DYN. NX: readelf -lW, GNU_STACK RW (not RWE). RELRO: readelf -lW has GNU_RELRO. Full RELRO: readelf -d shows BIND_NOW or FLAGS_1 NOW. Canary: readelf -sW lists __stack_chk_fail."
  - id: FND-02-c-pointers-and-memory-c12
    type: concept
    prompt: "A write to index 8 of `char buf[8]` inside `struct { char buf[8]; int id; }`: which sanitizer reports it, which stays silent, and why?"
    answer: "ASan stays silent: the byte is still inside the struct object, so no redzone is touched (intra-object). UBSan bounds reports it, because it knows buf's declared size is 8. The byte lands in id."
  - id: FND-02-c-pointers-and-memory-c13
    type: diagram
    prompt: "Draw main's -O0 frame for scores.c (int scores[4], int bonus) built with -fstack-protector-strong on the lab gcc, low to high addresses. Then compare with gdb x/ output."
    answer: "Low: bonus. Then scores[0..3] (16 bytes). Then an 8-byte gap. Then the 8-byte canary. Then, further up, saved rbp and the return address. The protector puts the array next to the canary and other locals below it."
  - id: FND-02-c-pointers-and-memory-c14
    type: concept
    prompt: "`char *out = malloc(n);` then a loop `for (i = 0; i <= n; i++) out[i] = s[i];` copies a string. Which line is the bug, and why is fixing the other one wrong?"
    answer: "The malloc: it must be n + 1. The <= loop correctly copies the NUL. Changing it to < n leaves out unterminated, so the next string read runs past the end (ASan then reports a READ)."
  - id: FND-02-c-pointers-and-memory-c15
    type: concept
    prompt: "Does a stack canary stop an off-by-one heap write? What does it detect, and when?"
    answer: "No. It is a value in the stack frame, checked when the function returns. It detects only contiguous stack overwrites that reach it. Heap writes and writes to other locals pass unnoticed."
  - id: FND-02-c-pointers-and-memory-c16
    type: fact
    prompt: "Why must _FORTIFY_SOURCE stay off in an ASan build, and what optimisation level does it need to do anything?"
    answer: "It is incompatible with sanitizers (OpenSSF hardening guide). It only takes effect at -O1 or higher."
  - id: FND-02-c-pointers-and-memory-c17
    type: code
    prompt: "In gdb, stop when the program writes '\\0' to the byte just past `char buf[16]`, even if that byte is already 0. Give the commands, and say why plain watch can fail here."
    answer: "break main, run, awatch -l *(char *)&buf[16], continue. awatch stops on any access. A watch watchpoint stops only when the value is written and changes (GDB manual), so writing 0 over 0 never triggers it."
  - id: FND-02-c-pointers-and-memory-c18
    type: procedure
    prompt: "You must know whether your gcc adds a stack canary by default. Give two independent checks, one on the compiler and one on a binary."
    answer: "Compiler: gcc -Q --help=common | grep stack-protector (the lab gcc shows -fstack-protector-strong [disabled]). Binary: readelf -sW prog | grep -c __stack_chk_fail (0 means no canary code)."
  - id: FND-02-c-pointers-and-memory-c19
    type: concept
    prompt: "In the lab's default scores.c build, bonus sits 8 bytes past the end of scores[4]. What does each loop bound i <= 4, 5, 6, 7 visibly do, and why does none of them crash?"
    answer: "4 and 5 write into an unused 8-byte gap: no effect. 6 overwrites bonus (prints bonus=60). 7 overwrites the loop variable i, which ends the loop. No canary exists in this build, so nothing checks the frame."
  - id: FND-02-c-pointers-and-memory-c20
    type: fact
    prompt: "Why can `git tag --contains <fix-commit>` wrongly suggest a release is unfixed? Give the iperf 3.19.1 example."
    answer: "A fix cherry-picked onto a release branch is a different commit with the same diff. iperf 3.19.1 has cherry-pick 42280d2, with the same patch-id as 4e5313ba, so --contains 4e5313ba omits 3.19.1. Check the file content or the patch-id."
  - id: FND-02-c-pointers-and-memory-c21
    type: concept
    prompt: "A memset one byte too long on a heap block: what is frame #0 of the ASan access stack, what is frame0, and how is frame0 defined?"
    answer: "Frame #0 is ASan's memset interceptor. frame0 is the first frame that is not a sanitizer interceptor or libc frame, i.e. the first frame in your own source: the function that called memset."
