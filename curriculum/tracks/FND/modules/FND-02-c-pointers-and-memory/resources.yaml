# Resources for FND-02-c-pointers-and-memory. Cards copied verbatim from research/ (schema: templates/resource-card.yaml).
# D7: every card needs verified within 180 days and status ok. Max 3 with role: core.
# Sources: research/targets/FND.md (iperf cards, 2026-11-11); research/domain-maps/foundations.md (sections C, D,
#   "FND-02 sources (added 2026-11-11)" and "FND-02 addendum: OpenSSL EVP_PKEY_decrypt");
#   research/domain-maps/glibc-userland-exploitation.md (sudo and how2heap cards).
# GDB cards point at the current online manual, a newer snapshot than the lab's gdb 16.3. The commands this module
