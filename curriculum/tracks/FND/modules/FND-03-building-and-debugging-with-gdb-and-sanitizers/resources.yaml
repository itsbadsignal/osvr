# Resources for FND-03-building-and-debugging-with-gdb-and-sanitizers. Cards copied verbatim from research/ (schema: templates/resource-card.yaml).
# D7: every card needs verified within 180 days and status ok. Max 3 with role: core.
# Sources: research/domain-maps/foundations.md (section D, 'FND-01 lab sources', 'FND-03 sources', 'FND-03 addendum'),
#   research/targets/FND.md (cJSON issue 800 card, completed version).
# The module-builder set `role` only (adding it where the research card has none); 'FND-03 use' comments are the module-builder's.
# Open: the ASan paper PDF body is unverified (card covers the landing page only); the gdb 16.x release manual is not filed.

