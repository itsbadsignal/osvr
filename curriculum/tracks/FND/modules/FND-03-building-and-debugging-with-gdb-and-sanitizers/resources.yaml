# Resources for FND-03-building-and-debugging-with-gdb-and-sanitizers. Cards copied verbatim from research/ (schema: templates/resource-card.yaml).
# D7: every card needs verified within 180 days and status ok. Max 3 with role: core.
# Sources: research/domain-maps/foundations.md (section D and 'FND-01 lab sources'), research/targets/FND.md (cJSON issue 800 card).
# Only `role` was set by the module-builder; other fields are as filed. 'FND-03 use' comments are the module-builder's.
# TODO(research): no CMake or GNU make documentation is filed (CMAKE_C_FLAGS, CheckCCompilerFlag, CMAKE_EXPORT_COMPILE_COMMANDS,
#   CMakeConfigureLog.yaml, ctest working directory; make command-line variable override). The README states these from lab observation.
# TODO(research): the ASan paper PDF or the sanitizers project's algorithm page (shadow mapping, redzones, quarantine) is not filed;
#   the README derives the shadow check from disassembly instead.
# TODO(research): no source filed for the ASAN_OPTIONS flags used (abort_on_error, detect_leaks, malloc_fill_byte, help);
#   the README cites the runtime's own ASAN_OPTIONS=help=1 output in the lab.
# TODO(research): the cjson-issue-800 card below lacks author, kind, cost, published, targets, assumes and status in research/targets/FND.md.

resources:
  - title: "Debugging with GDB (current manual)"
