# Seed retrieval deck for FND-01-linux-lab-and-learning-protocol. Minimum 12 cards (D4).
# Free recall only. The answer must not be visible in the prompt. Answer side ~60 words max; split longer ones.
# type: fact | concept | procedure | diagram | code
# Scheduling fields are added by scripts/srs.py when the learner imports the deck; do not add them here.

cards:
  - id: FND-01-linux-lab-and-learning-protocol-c01
    type: procedure
    prompt: "From memory, list the steps of an OSVR study session in order, from sitting down to closing the laptop."
    answer: "1. Declare one goal with an observable done-check. 2. Set the timebox (default 50 min). 3. Work, parking off-task urges in a distraction log. 4. Verify the done-check. 5. 3-minute closed-notes free recall, gaps to cards. 6. Write the next action and the session log."
  - id: FND-01-linux-lab-and-learning-protocol-c02
    type: concept
    prompt: "Name the three tests a session goal must pass, and what each one rules out."
    answer: "Observable: someone else can check it from a file, output or exit code (rules out 'understand X'). Bounded: fits one timebox (rules out 'learn heap'). Single: one done-condition (rules out 'X and also Y')."
  - id: FND-01-linux-lab-and-learning-protocol-c03
    type: concept
    prompt: "Rewrite 'fix my lab' as a session goal that passes all three goal tests."
    answer: "For example: 'Done when lab/check.sh exits 0 on an image rebuilt after rmi.' Any answer passes if the done-check is an artefact or exit code, fits 50 minutes, and has one condition."
  - id: FND-01-linux-lab-and-learning-protocol-c04
    type: concept
    prompt: "Why does the session close with free recall from memory rather than rereading your notes?"
    answer: "Retrieval (producing the answer) improves retention more than restudy, and recall beats recognition (research/benchmarks/learning-science.md section 1). Rereading feels fluent but does not test you. The misses also show your real gaps, which become cards."
  - id: FND-01-linux-lab-and-learning-protocol-c05
    type: fact
    prompt: "Which parts of the OSVR session protocol have no published evidence behind them, and how does OSVR treat them?"
    answer: "The 50/10 timebox, the distraction log, the logged next step, and the 20-minute struggle rule. They are pilot parameters: log actual times and tune from pilot data."
  - id: FND-01-linux-lab-and-learning-protocol-c06
    type: concept
    prompt: "Inside a container you read /proc/sys/kernel/randomize_va_space and get the same value as on the host. Explain why."
    answer: "A container is a host process with an isolated view, not a VM. There is one kernel, so kernel settings such as ASLR policy come from the host and are shared."
  - id: FND-01-linux-lab-and-learning-protocol-c07
    type: concept
    prompt: "A lab recipe says FROM debian:trixie. What reproducibility risk does that carry, and what do you record instead?"
    answer: "A tag is a movable label. A later push can change gcc and libraries under the same name, which changes reports. Pin and record the image digest (a content hash)."
  - id: FND-01-linux-lab-and-learning-protocol-c08
    type: concept
    prompt: "Your smoke test ran and printed a report, but no file appeared on the host. What is the most likely cause, and why?"
    answer: "The report was written to the container's own filesystem, not to the bind-mounted directory. That layer is thrown away when a --rm container exits, so only writes under the -v mount survive."
  - id: FND-01-linux-lab-and-learning-protocol-c09
    type: code
    prompt: "Write one shell line that sets ENGINE to podman if it is installed, otherwise to docker."
    answer: "ENGINE=$(command -v podman || command -v docker)"
  - id: FND-01-linux-lab-and-learning-protocol-c10
    type: code
    prompt: "Write the command that runs image osvr-fnd01:1 with no network, removes the container on exit, and maps ~/osvr-work/fnd01/out to /out."
    answer: "\"$ENGINE\" run --rm --network=none -v ~/osvr-work/fnd01/out:/out osvr-fnd01:1"
  - id: FND-01-linux-lab-and-learning-protocol-c11
    type: diagram
    prompt: "Draw the host and the running lab container: kernel, filesystems, the bind mount, the network. Then compare."
    answer: "One box, host kernel, at the bottom, shared by both. Host filesystem with ~/osvr-work/fnd01/out. Container filesystem = image layers + throwaway write layer. Arrow: host out/ <-> container /out (bind mount, the only persistent path). Container network: none, with no arrow out."
  - id: FND-01-linux-lab-and-learning-protocol-c12
    type: procedure
    prompt: "From an ASan report, which three fields do you copy into your notes before doing anything else?"
    answer: "1. The ERROR line (error kind). 2. The first stack frame in project code, with file:line (skip ASan interceptors and libc). 3. The allocation (or free) site of the memory block involved."
  - id: FND-01-linux-lab-and-learning-protocol-c13
    type: fact
    prompt: "Does ASan report a bad memory access when it happens, or when the program later crashes? Is it a mitigation?"
    answer: "At the bad access itself, then it stops the program. It is a detection tool, not a mitigation: about 2x slowdown and not intended for production (Clang ASan docs)."
  - id: FND-01-linux-lab-and-learning-protocol-c14
    type: concept
    prompt: "check.sh builds the same harness against the cJSON commit that fixed the bug and expects a clean exit. What does that step prove?"
    answer: "It is a negative control. It shows the report comes from the vulnerable code, not from a broken toolchain, wrong flags or a faulty harness. Without it, a report could be an artefact of the lab."
  - id: FND-01-linux-lab-and-learning-protocol-c15
    type: concept
    prompt: "Two runs of the smoke test give reports with different hex addresses. Is the lab non-reproducible? What do you compare instead?"
    answer: "No. ASLR (a host kernel setting) moves memory each run. Compare the error kind, the function names and the file:line, and the size relation to the block, never the raw addresses."
  - id: FND-01-linux-lab-and-learning-protocol-c16
    type: concept
    prompt: "Under rootful Docker the report on your host is owned by UID 0. Under rootless podman it is yours. Explain the difference."
    answer: "Rootless podman maps root inside the container to your own UID outside. A root Docker daemon runs the container as real root, so files written to the bind mount come out root-owned unless you pass --user."
  - id: FND-01-linux-lab-and-learning-protocol-c17
    type: procedure
    prompt: "You are stuck on a lab step. What do you do before asking for help, and how do you ask?"
    answer: "Struggle for the struggle-rule time (20 min, pilot value) and write down what you tried and what you saw. Then ask for one hint rung at a time, starting at rung 0 (restate goal, list attempts), and log the time to first hint."
  - id: FND-01-linux-lab-and-learning-protocol-c18
    type: concept
    prompt: "What makes a 'next action' at the end of a session good enough, and give one example that fails."
    answer: "It can be started cold within minutes: one runnable command, one file:line to open, or one precise question. 'Continue with the lab' fails: it tells you nothing about where to start."
