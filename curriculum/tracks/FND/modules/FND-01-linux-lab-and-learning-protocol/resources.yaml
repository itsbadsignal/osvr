    author: "oliverchang (reporter), DaveGamble/cJSON issue tracker"
    kind: advisory
    tier: T1
    cost: free
    published: 2023-11-29
    targets: "cJSON v1.7.17 and earlier; fixed by commit 3ef4e4e730e5efd381be612df41e1ff3f5bb3c32 (v1.7.18)"
    covers: PoC `{"1":1,`, why exact-size buffers expose the bug, fuzz harness blind spot
    assumes: "C, reading an ASan report"
    scores: {directness: 5, currency: 4, depth: 3, activity: 2, cost: 5, accessibility: 4}
    role: deep-dive
    verified: 2026-11-10
    status: ok
    # Fields title/url/tier/verified/covers copied verbatim from research/targets/FND.md. author, published, targets
    # taken from the same file's cJSON section (reporter oliverchang, 2023-11-29, v1.7.17, fix 3ef4e4e); kind, cost,
    # assumes, scores and status are module-builder judgement. No new fetch.
    # FND-01 use: the source of the smoke test's input. Do not read it during FND-01; it discusses the
    # cause, which you are better off finding yourself in FND-03. Read it after FND-03 to compare.

