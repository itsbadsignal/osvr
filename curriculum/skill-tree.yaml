# OSVR skill tree. Source of truth for sequencing.
# Validate with: python3 scripts/validate.py --tree-only
# Decisions: DR-0001 (track set, core sequencing), DR-0002 (outcome wording, proposed),
#            DR-0003 (first real-bug target class), DR-0004 (conditional D5),
#            DR-0005 (conditional programming on-ramp FND-00), DR-0006 (capstones under tracks/CAP)
#
# Optional field `conditional:` (DR-0005): one-line gate. Nodes carrying it are taken only
# when the gate says so; core hours are reported with and without them.
#
# Node fields: see templates/skill-tree.example.yaml.
# Nodes are listed in the RECOMMENDED core study order (DR-0001 option D2), not grouped
# by track. Prereqs are honest minimums; the DAG permits earlier starts than this order.
# All hours are pilot parameters (no provider publishes hours from zero;
# research/benchmarks/curricula-and-trainings.md "Hour totals from zero").
# Mitigation lists name what is in play; per-version claims for glibc, Windows and
# embedded defaults are unverified (FIELD-SYNTHESIS Q2-Q4) and marked TODO(research).

version: 1
updated: 2026-11-10

tracks:
  FND: {title: Foundations, core: true}
  RE:  {title: Reverse engineering, core: true}
  BX:  {title: Binary exploitation (userland), core: true}
  VD:  {title: Vulnerability discovery, core: true}
  PRO: {title: Professional practice and disclosure, core: true}
  CAP: {title: Graduation capstones, core: true}
  # Electives, recommended order by first-0-day reachability and hiring value (DR-0001)
  EMB: {title: "Embedded, firmware and appliances", core: false}
  LK:  {title: Linux kernel, core: false}
  HV:  {title: Hypervisors and device emulation, core: false}
  WIN: {title: Windows user and kernel, core: false}
  MOB: {title: Mobile (Android first), core: false}
  BRW: {title: Browsers and JS engines, core: false}

