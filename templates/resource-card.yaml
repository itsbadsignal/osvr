# One resource card. Lists of these go in research files and in modules' resources.yaml under `resources:`.
# Rule: every field below comes from a page you actually fetched. If you could not fetch it, verified: null and status: unverified.

- title: "<exact title as shown on the page>"
  url: "<url you fetched>"
  author: "<person or org, as shown>"
  kind: writeup | talk | paper | course | wargame | book | docs | source | advisory | tool
  tier: T1 | T2 | T3
  cost: free | paid | freemium
  published: YYYY-MM-DD | YYYY | unknown
  targets: "<software and versions it covers, e.g. glibc 2.35>"
  covers: "<one line, your own words>"
  assumes: "<prereqs it silently assumes>"
  scores: {directness: 1-5, currency: 1-5, depth: 1-5, activity: 1-5, cost: 1-5, accessibility: 1-5}
  role: core | reference | deep-dive | alternative     # set by module-builder; max 3 core per module
  verified: YYYY-MM-DD | null
  status: ok | unverified | moved | changed | dead
