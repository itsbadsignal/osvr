# OSVR skill tree. Source of truth for sequencing.
# Copy to curriculum/skill-tree.yaml. Validate with: python3 scripts/validate.py --tree-only
#
# Node fields
#   id           <TRACK>-<NN>-<slug>, never reused
#   title        short human title
#   track        must match the id prefix and a key in `tracks`
#   status       planned | drafting | ready | deprecated
#   prereqs      list of node ids that are genuinely required
#   outcomes     subset of [map, find, rootcause, exploit, disclose]
#   hours        realistic estimate for the target learner, including project
#   rds          the rate-determining step (what drills target)
#   mitigations  mitigations in play for this module (D9)
#   direct_target  the real artefact; filled by module-builder

version: 1
updated: 2026-11-10

tracks:
