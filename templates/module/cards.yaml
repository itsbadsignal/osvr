# Seed retrieval deck for <MODULE_ID>. Minimum 12 cards (D4).
# Free recall only. The answer must not be visible in the prompt. Answer side ~60 words max; split longer ones.
# type: fact | concept | procedure | diagram | code
# Scheduling fields are added by scripts/srs.py when the learner imports the deck; do not add them here.

cards:
  - id: <MODULE_ID>-c01
    type: concept
    prompt: "Why does <X> make <Y> exploitable?"
    answer: "..."
  - id: <MODULE_ID>-c02
    type: procedure
    prompt: "List, in order, the steps to <...>"
    answer: "1. ... 2. ... 3. ..."
  - id: <MODULE_ID>-c03
    type: diagram
    prompt: "Draw the <structure> after <sequence>. Then compare."
    answer: "<ascii diagram or precise description>"
